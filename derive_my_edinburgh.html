<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2efe4">
<title>dérive. · My Edinburgh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --paper:#f2efe4; --ink:#643819; --brick:#a84710; --forest:#084d40; --gutter:clamp(18px,5.8vw,25px); }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.55 "Fira Code",Consolas,monospace; }
.app { max-width:510px; min-height:100svh; margin:auto; box-shadow:0 0 30px #362a1d12; }
.top {
  display:grid; place-items:center; position:relative;
  min-height:calc(70px + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top);
  background:linear-gradient(#e5b67230,#e5b67218); color:var(--brick);
  font-size:25px; font-weight:600; letter-spacing:-1.7px;
}
.top::after {
  content:""; position:absolute; bottom:0; inset-inline:var(--gutter);
  border-bottom:1px dashed #c8592480;
}
main {
  padding:clamp(18px,4svh,34px)
    max(var(--gutter),env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(var(--gutter),env(safe-area-inset-left));
}
h1 { font-size:clamp(28px,8vw,39px); font-weight:500; letter-spacing:-.075em; line-height:1.15; margin:0 0 6px; }
.intro { margin:0 0 18px; font-size:13px; }
figure {
  position:relative; margin:0; overflow:hidden;
  border:1px solid #bfc9b9; border-radius:4px 23px 4px 25px; background:#eaf0e7;
}
figure svg { display:block; width:100%; height:auto; }
figure::after {
  content:""; position:absolute; inset:70% 0 0;
  background:linear-gradient(transparent,#edf1e8d9); pointer-events:none;
}
figcaption {
  position:absolute; z-index:1; bottom:9px; right:10px; padding:2px 6px;
  color:var(--ink); background:#f6f4e9e8; border-radius:2px 6px; font-size:10px;
}
.walk {
  stroke:var(--colour); stroke-width:2.4; vector-effect:non-scaling-stroke;
  transition:opacity .2s,stroke-width .2s;
}
.walks.has-selection .walk { opacity:.28; }
.walks.has-selection .walk.selected { opacity:1; stroke-width:3.7; }
.map-marker {
  position:absolute; z-index:2; left:var(--x); top:var(--y); translate:-50% -50%;
  display:grid; place-items:center; width:44px; height:44px; padding:0;
  border:0; border-radius:50%; background:transparent;
}
.map-marker span {
  display:grid; place-items:center; width:23px; height:23px; border:1px solid var(--brick);
  border-radius:50%; background:#faf5e5; color:var(--ink); font-size:11px;
  font-weight:600; box-shadow:0 1px 3px #64381933;
}
.map-marker[aria-pressed="true"] span { background:var(--brick); color:#fff8e9; }
.map-marker:focus-visible { outline-offset:-4px; }
.status { margin:11px 0 0; min-height:1.55em; font-size:12px; }
.status p { margin:0; }
.walk-card {
  padding:9px 11px; background:#faf5e5; border-left:2px solid var(--brick);
  border-radius:2px 9px 2px 2px;
}
.walk-card strong, .walk-card span { display:block; }
.walk-meta { margin-top:4px; font-size:11px; }
.buttons { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
button:focus-visible, summary:focus-visible { outline:2px solid var(--forest); outline-offset:3px; }
button:active { transform:translateY(1px); }
.replay {
  min-height:44px; padding:6px 14px; border:1px solid var(--forest);
  border-radius:4px 13px 5px 12px; background:var(--forest); color:#f2efe4;
}
details { margin-top:15px; border-block:1px solid #c4c4b2; }
summary { cursor:pointer; padding:11px 0; min-height:44px; }
ol { margin:0; padding:0 0 5px; list-style:none; }
.walk-select {
  display:grid; grid-template-columns:15px 1fr; align-items:center; gap:7px; text-align:left;
  min-height:44px; width:100%; border:0; padding:5px 8px; background:transparent;
  border-radius:4px 11px; font-size:12px;
}
.walk-select::before { content:""; border-top:2px solid var(--brick); }
.walk-select[aria-pressed="true"] { background:#e5b67247; font-weight:600; }
@media (prefers-reduced-motion:reduce) { .walk { transition:none; } }
</style>
</head>
<body>

<script>
(() => {
  const map = document.querySelector('.walks');
  const paths = [...map.querySelectorAll('.walk')];
  const buttons = [...document.querySelectorAll('.walk-select')];
  const markers = [...document.querySelectorAll('.map-marker')];
  const status = document.getElementById('status-message');
  const card = document.getElementById('walk-card');
  const cardTitle = document.getElementById('walk-title');
  const cardDescription = document.getElementById('walk-description');
  const cardMeta = document.getElementById('walk-meta');
  const sampleDetails = [
    "sample · 18 Nov 2026 · 2.3 mi · 31 min",
    "sample · 20 Nov 2026 · 1.4 mi · 25 min",
    "sample · 22 Nov 2026 · 1.7 mi · 29 min",
    "sample · 24 Nov 2026 · 2.0 mi · 36 min",
    "sample · 27 Nov 2026 · 1.6 mi · 28 min"
  ];
  const replay = document.getElementById('replay');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const summary = paths.length + ' walks woven together.';
  let animations = [];
  let selected = -1;

  function clearAnimations() {
    animations.forEach(animation => animation.cancel());
    animations = [];
  }

  function select(next) {
    selected = next;
    map.classList.toggle('has-selection', selected >= 0);
    buttons.forEach((button, index) => {
      const pressed = String(index === selected);
      button.setAttribute('aria-pressed', pressed);
      markers[index].setAttribute('aria-pressed', pressed);
      paths[index].classList.toggle('selected', index === selected);
    });
    status.hidden = selected >= 0;
    card.hidden = selected < 0;
    if (selected < 0) {
      status.textContent = summary;
      return;
    }
    const [title, description] = buttons[selected].textContent.trim().split(' · ');
    cardTitle.textContent = title;
    cardDescription.textContent = description;
    cardMeta.textContent = sampleDetails[selected];
  }

  function play() {
    clearAnimations();
    select(-1);
    if (motion.matches || !Element.prototype.animate) return;
    status.textContent = 'Drawing your walks…';
    // Every path uses a normalized length so the dash can reveal it end to end.
    animations = paths.map((path, index) => path.animate(
      [{ strokeDasharray:'1', strokeDashoffset:1 }, { strokeDasharray:'1', strokeDashoffset:0 }],
      { duration:1800, delay:180 + index * 860, easing:'cubic-bezier(.32,.08,.48,1)', fill:'backwards' }
    ));
    Promise.all(animations.map(animation => animation.finished)).then(() => {
      animations = [];
      status.textContent = summary;
    }, () => {});
  }

  replay.addEventListener('click', play);
  function toggleWalk(index) {
    clearAnimations();
    select(selected === index ? -1 : index);
  }
  buttons.forEach((button, index) => button.addEventListener('click', () => toggleWalk(index)));
  markers.forEach((marker, index) => marker.addEventListener('click', () => toggleWalk(index)));
  motion.addEventListener('change', () => {
    clearAnimations();
    select(selected);
  });
  play();
})();
</script>
